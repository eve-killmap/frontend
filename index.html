<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVE Killmap</title>
    <meta
      name="description"
      content="Interactive 3D visualization of PvP kill activity across New Eden."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EVE Killmap" />
    <meta property="og:title" content="EVE Killmap" />
    <meta
      property="og:description"
      content="EVE Killmap is an interactive 3D visualization of PvP kill activity across New Eden. Explore any solar system, watch kills unfold over time, and see where the fighting happens."
    />
    <meta property="og:image" content="https://eve-killmap.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="EVE Killmap: a 3D killmap of New Eden"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVE Killmap" />
    <meta
      name="twitter:description"
      content="EVE Killmap is an interactive 3D visualization of PvP kill activity across New Eden. Explore any solar system, watch kills unfold over time, and see where the fighting happens."
    />
    <meta name="twitter:image" content="https://eve-killmap.com/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon-mask.svg" color="#c08a1e" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&family=Space+Mono:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #070d12;
        margin: 0;
      }
      #initial-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #initial-loading .spinner {
        box-sizing: border-box;
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 2px solid #1e3a50;
        border-top-color: #c08a1e;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading">
        <div class="spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
